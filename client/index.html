<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Covenant World — zone test client</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11151c;
        --panel: #1b2029;
        --text: #e6e9ef;
        --muted: #8b95a7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0; }
      #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        background: var(--panel);
        border-radius: 8px;
        max-width: 100%;
      }
      #hud span { white-space: nowrap; }
      .muted { color: var(--muted); }
      canvas {
        background: #26301f;
        border-radius: 8px;
        max-width: 100%;
        touch-action: none;
      }
      footer { color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <h1>Covenant World — zone test client</h1>
    <div id="hud">
      <span id="status">connecting…</span>
      <span id="population" class="muted"></span>
      <span id="room" class="muted"></span>
    </div>
    <canvas id="stage" width="800" height="600"></canvas>
    <footer class="muted">
      WASD or arrow keys to walk. Open a second tab to see another player.
      Add <code>?name=Ash</code> to pick a name.
    </footer>
    <script src="/vendor/colyseus.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
