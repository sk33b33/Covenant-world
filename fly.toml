# Rename `app` if you like — `fly launch` will also offer to set it.
app = "covenant-world"
primary_region = "lhr"

[build]

[env]
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # A zone server holds live rooms in memory. Stopping the machine drops every
  # player in it, so it stays up rather than sleeping when idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
